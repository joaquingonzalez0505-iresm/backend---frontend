  <line x1="200" y1="147" x2="200" y2="185" stroke="#475569" stroke-width="2"/>
  <!-- Logo dot -->
  <circle cx="200" cy="225" r="7" fill="#38bdf8" opacity="0.8"/>
  <text x="200" y="320" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Mouse Inalámbrico G Pro</text>
  <text x="200" y="348" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Sensor Óptico 25K HERO</text>
</svg>
