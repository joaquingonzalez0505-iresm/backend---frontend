<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1b2434"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="30" fill="url(#bgMouse)"/>
  <!-- Mouse outline -->
  <path d="M150 140 C150 90, 250 90, 250 140 L250 210 C250 270, 150 270, 150 210 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
